<!DOCTYPE html>
<html lang="{{ site.active_lang }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — OpenLobster{% else %}OpenLobster{% endif %}</title>
  {% assign t = site.data.i18n[site.active_lang] %}
  <meta name="description" content="{{ t.meta.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ t.meta.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0D0D0D">
  {% for lang in site.languages %}
    {% if lang == site.default_lang %}
  <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ site.baseurl }}/">
    {% else %}
  <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ site.baseurl }}/{{ lang }}/">
    {% endif %}
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ site.baseurl }}/">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
</body>
</html>
