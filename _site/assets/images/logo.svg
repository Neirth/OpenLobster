<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="OpenLobster logo">
  <!-- Background -->
  <rect width="120" height="120" rx="20" fill="#0D0D0D"/>

  <!-- Left claw upper arm -->
  <path d="M36 56 C28 46 26 34 34 26 C40 20 48 22 50 30" stroke="#4F8EF7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Left claw lower arm -->
  <path d="M36 56 C26 60 24 72 32 76 C38 79 46 76 48 68" stroke="#4F8EF7" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Right claw upper arm -->
  <path d="M84 56 C92 46 94 34 86 26 C80 20 72 22 70 30" stroke="#4F8EF7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Right claw lower arm -->
  <path d="M84 56 C94 60 96 72 88 76 C82 79 74 76 72 68" stroke="#4F8EF7" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Body -->
  <ellipse cx="60" cy="66" rx="20" ry="26" fill="#1E1E1E" stroke="#4F8EF7" stroke-width="2.5"/>

  <!-- Head -->
  <ellipse cx="60" cy="40" rx="13" ry="11" fill="#1E1E1E" stroke="#4F8EF7" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="55" cy="37" r="2.5" fill="#4F8EF7"/>
  <circle cx="65" cy="37" r="2.5" fill="#4F8EF7"/>

  <!-- Antennae -->
  <line x1="54" y1="31" x2="45" y2="18" stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="31" x2="75" y2="18" stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body segments -->
  <line x1="42" y1="62" x2="78" y2="62" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="42" y1="72" x2="78" y2="72" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="42" y1="80" x2="78" y2="80" stroke="#2C2C2C" stroke-width="1.5"/>

  <!-- Tail fans -->
  <path d="M50 88 C46 97 40 101 36 99" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M55 90 C53 99 51 105 47 105" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M60 91 C60 100 60 106 60 106" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M65 90 C67 99 69 105 73 105" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M70 88 C74 97 80 101 84 99" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
