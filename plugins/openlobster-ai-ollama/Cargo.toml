[package]
name = "openlobster-ai-ollama"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
ollama-rs = { version = "0.3", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
