[package]
name = "openlobster-messages-slack"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
slack-morphism = { version = "2.20", features = ["hyper"] }
hyper = "1.0"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2"] }
hyper-rustls = "0.27"
http-body-util = "0.1"
base64 = "0.22"
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
