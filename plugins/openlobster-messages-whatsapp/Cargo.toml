[package]
name = "openlobster-messages-whatsapp"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
whatsapp-business-rs = "0.5"
base64 = "0.22"
opus-rs = "0.1"
ogg = "0.9"
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
