[package]
name = "openlobster-memory-gml"
version = "0.1.0"
edition = "2021"

[dependencies]
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
