[package]
name = "openlobster-messages-discord"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
twilight-http = { version = "0.14", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "0.14"
twilight-gateway = "0.14"
hyper = "0.14"
hyper-rustls = "0.24"
futures = "0.3"
base64 = "0.22"
opus-rs = "0.1"
ogg = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
