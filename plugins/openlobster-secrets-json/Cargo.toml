[package]
name = "openlobster-secrets-json-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
openlobster-sdk-base = { path = "../openlobster-sdk-base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
