features:
  label: "Características"
  title: "Todo lo que necesitas, en un solo binario."
  items:
    - title: "Arquitectura Dual Go+Rust"
      body: "El núcleo hiper-concurrente en Go orquesta el agente, mientras que las integraciones críticas (IA, WhatsApp, Secretos) corren aisladas en submódulos de Rust vía JSON-RPC. Arranque en 200ms y 30MB de RAM."
      tag: "Arquitectura Aislada"
    - title: "Memoria de Grafos"
      body: "Supera la limitación de archivos markdown. OpenLobster utiliza una base de datos de grafos (Neo4j/GML) para construir relaciones tipificadas, permitiendo que el agente aprenda y navegue por contextos complejos sin colapsar."
      tag: "Neo4j / GML"
    - title: "Identidades Unificadas"
      body: "Gestión agnóstica al canal. Cada usuario mantiene su propio contexto de conversación, permitiendo al agente sintetizar un grafo de conocimiento global que interconecta la información entre múltiples usuarios y plataformas."
      tag: "Grafo Global"
    - title: "Scheduler de Eventos"
      body: "Tu agente está vivo 24/7 sin agotar recursos. Un estricto bucle de eventos lo despierta solo ante acciones reales y tareas programadas, garantizando precisión sub-segundo."
      tag: "Bucle de Eventos"
    - title: "Marketplace MCP Nativo"
      body: "Dale manos a tu agente al instante. Instala servidores Model Context Protocol desde el panel web (SolidJS) y expande sus capacidades (Búsqueda web, Git, Archivos) sin tocar código."
      tag: "Extensión MCP"
