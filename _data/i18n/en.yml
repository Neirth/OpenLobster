features:
  label: "What changed"
  title: "Every OpenClaw flaw, addressed."
  problem_1: >-
    OpenClaw had a moment — self-hosted AI agent, fast growth, lots of
    attention. Then the security community looked at it.
    CVE-2026-25253 (CVSS 8.8): 1-click RCE via querystring injection in the
    control UI. CVE-2026-25593, CVE-2026-24763, CVE-2026-25157,
    CVE-2026-25475, and more filling a full page on RedPacket. Cisco
    published a report calling personal AI agents like OpenClaw a security
    nightmare. Microsoft's Security Blog recommended running it only inside
    an isolated VM with a dedicated non-privileged account. By February
    2026, 40,000 exposed instances were indexed on Censys — 63% of them
    vulnerable to remote code execution.
  problem_2: >-
    Beyond security: the memory system was a MEMORY.md file. The scheduler
    was a heartbeat daemon waking up every 30 minutes to read a checklist.
    There was no concept of separate users — the docs listed
    "only the main session writes to MEMORY.md" as a feature. The skills
    marketplace shipped 26% of entries with at least one vulnerability.
  problem_3: >-
    OpenLobster is the fork that addresses the list. Not a rebranding — a
    rewrite of every part that was broken, starting with the assumption that
    security is not optional.
  items:
    - title: "Security by default"
      body: >-
        Dashboard auth is enforced before first launch, not an opt-in flag.
        Config and secrets are encrypted on disk. API keys live in a secrets
        backend — encrypted file or OpenBao — never in plain YAML. Env vars
        with the <code>OPENLOBSTER_</code> prefix are never forwarded to
        terminal tools.
      tag: "CVE-hardened"
    - title: "Graph memory"
      body: >-
        MEMORY.md does not scale and does not reason about relationships.
        OpenLobster uses Neo4j as a first-class graph database: typed nodes,
        typed edges, and relationship weights the agent builds and updates as
        it converses. A file-based GML backend is available for single-node
        setups where running Neo4j is impractical.
      tag: "Neo4j or file backend"
    - title: "First-class multi-user"
      body: >-
        Each user on every channel is a separate entity: own conversation
        history, own tool permissions, own pairing flow. A Telegram user and
        a Discord user can talk to the same agent simultaneously without
        sharing context or stepping on each other's sessions.
      tag: "Per-user permissions"
    - title: "Real task scheduler"
      body: >-
        The 30-minute heartbeat loop reading a HEARTBEAT.md checklist is
        removed. Recurring jobs use cron expressions. One-shot tasks use ISO
        8601 datetimes. Status, next-run time, and execution logs are visible
        in the dashboard without touching a config file.
      tag: "Cron + ISO 8601"
    - title: "Full MCP integration"
      body: >-
        Any Streamable HTTP MCP server works: OAuth 2.1 is handled end-to-end,
        tool browsing is per-server, and each user gets an explicit permission
        matrix so you control exactly what they can invoke. A one-click
        marketplace covers the most common integrations.
      tag: "OAuth 2.1 + per-user matrix"
    - title: "Go backend, single binary"
      body: >-
        The entire Node.js backend has been rewritten in Go with a GraphQL
        API generated by gqlgen. The output is a single static binary with
        no runtime dependency. 200 ms cold start. 30 MB RAM. Runs on a
        Raspberry Pi 3, a VPS with 512 MB, or a $15 LicheeRV Nano.
      tag: "Go + gqlgen"

compare:
  label: "Comparison"
  title: "How OpenLobster positions in the landscape."
  subtitle: >-
    The Claw family and the broader self-hosted AI agent ecosystem share
    overlapping goals but make very different trade-offs. OpenClaw,
    PicoClaw, and NanoClaw are direct architectural relatives. Open WebUI
    and AnythingLLM represent the alternative approach: polished chat
    interfaces with no channel integrations or autonomous scheduling.
