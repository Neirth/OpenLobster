features:
  label: "有何变化"
  title: "OpenClaw 的每个缺陷，逐一修正。"
  problem_1: >-
    OpenClaw 曾经风光一时 — 自托管 AI 助手，快速增长，备受关注。然后安全社区对其
    进行了审查。CVE-2026-25253（CVSS 8.8）：通过控制界面查询字符串注入实现一键
    RCE。CVE-2026-25593、CVE-2026-24763、CVE-2026-25157、CVE-2026-25475 等，在
    RedPacket 上占满整页。思科发布报告，称像 OpenClaw 这样的个人 AI 助手是安全
    噩梦。微软安全博客建议仅在隔离虚拟机中使用专用非特权账户运行它。到 2026 年
    2 月，Censys 上已索引 40,000 个暴露实例 — 其中 63% 存在远程代码执行漏洞。
  problem_2: >-
    除安全问题外：内存系统是一个 MEMORY.md 文件。调度器是一个每隔 30 分钟醒来
    读取清单的心跳守护进程。没有独立用户的概念 — 文档将"只有主会话写入
    MEMORY.md"列为一个特性。技能市场中 26% 的条目至少存在一个漏洞。
  problem_3: >-
    OpenLobster 是解决这一系列问题的分叉项目。这不是更名 — 而是对每个存在问题的
    部分进行重写，从安全不是可选项这一前提出发。
  items:
    - title: "默认安全"
      body: >-
        控制面板身份验证在首次启动前强制执行，而非可选标志。配置和密钥在磁盘上
        加密存储。API 密钥保存在密钥后端 — 加密文件或 OpenBao — 永远不会以明文
        YAML 存储。带有 <code>OPENLOBSTER_</code> 前缀的环境变量永远不会转发给
        终端工具。
      tag: "CVE 加固"
    - title: "图式内存"
      body: >-
        MEMORY.md 无法扩展，也无法推理关系。OpenLobster 将 Neo4j 作为一等公民图
        数据库：类型化节点、类型化边，以及助手在对话中构建和更新的关系权重。对于
        运行 Neo4j 不切实际的单节点部署，可使用基于文件的 GML 后端。
      tag: "Neo4j 或文件后端"
    - title: "一等公民多用户"
      body: >-
        每个渠道上的每个用户都是独立实体：独立的对话历史、独立的工具权限、独立的
        配对流程。Telegram 用户和 Discord 用户可以同时与同一助手交谈，而不会共享
        上下文或干扰彼此的会话。
      tag: "按用户设置权限"
    - title: "真正的任务调度器"
      body: >-
        移除了读取 HEARTBEAT.md 清单的 30 分钟心跳循环。周期性任务使用 cron 表达式。
        一次性任务使用 ISO 8601 日期时间。状态、下次运行时间和执行日志在控制面板
        中可见，无需修改配置文件。
      tag: "Cron + ISO 8601"
    - title: "完整 MCP 集成"
      body: >-
        任何 Streamable HTTP MCP 服务器均可使用：OAuth 2.1 端到端处理，工具浏览
        按服务器划分，每个用户获得明确的权限矩阵，让您精确控制其可调用的内容。
        一键式市场涵盖最常见的集成。
      tag: "OAuth 2.1 + 按用户矩阵"
    - title: "Go 后端，单一二进制"
      body: >-
        整个 Node.js 后端已用 Go 重写，GraphQL API 由 gqlgen 生成。输出是一个无
        运行时依赖的单一静态二进制文件。冷启动 200 毫秒。30 MB 内存。可在
        Raspberry Pi 3、512 MB VPS 或 15 美元的 LicheeRV Nano 上运行。
      tag: "Go + gqlgen"

compare:
  label: "对比"
  title: "OpenLobster 在生态中的定位。"
  subtitle: >-
    Claw 家族和更广泛的自托管 AI 助手生态系统有着共同的目标，但做出了截然不同
    的权衡。OpenClaw、PicoClaw 和 NanoClaw 是直接的架构近亲。Open WebUI 和
    AnythingLLM 代表了另一种方式：精致的聊天界面，但没有渠道集成或自主调度功能。
