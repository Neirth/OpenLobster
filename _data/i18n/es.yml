  title: "El asistente IA<br>diseñado para <strong>ser seguro</strong>."
  body: >-
    OpenLobster es un agente de IA personal y autoalojado. Se ejecuta como un
    único binario de Go, se conecta a los canales que tus usuarios ya usan y
    viene con autenticación activada por defecto — a diferencia del proyecto
