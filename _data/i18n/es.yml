quickstart:
  label: "Inicio rápido"
  title: "En marcha en menos de dos minutos."
  subtitle: >-
    Compila desde el código fuente o descarga la imagen de Docker. Sin Node,
    sin npm, sin node_modules. Solo un binario y un archivo de configuración.

stack:
  label: "Pila tecnológica"
  title: "Tecnología aburrida, deliberadamente."
  subtitle: >-
    Sin rotación de frameworks. Cada elección se hizo para reducir la
    sobrecarga operativa y mantener el binario lo suficientemente pequeño
    para ejecutarse en el borde.
