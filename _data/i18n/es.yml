features:
  label: "Qué cambió"
  title: "Cada fallo de OpenClaw, corregido."
  problem_1: >-
    OpenClaw tuvo su momento — agente de IA autoalojado, crecimiento rápido,
    mucha atención. Luego la comunidad de seguridad lo analizó.
    CVE-2026-25253 (CVSS 8.8): RCE con un clic mediante inyección en el
    querystring de la interfaz de control. CVE-2026-25593, CVE-2026-24763,
    CVE-2026-25157, CVE-2026-25475, y más, llenando una página completa en
    RedPacket. Cisco publicó un informe calificando a los agentes de IA
    personales como OpenClaw como una pesadilla de seguridad. El Blog de
    Seguridad de Microsoft recomendó ejecutarlo únicamente dentro de una VM
    aislada con una cuenta sin privilegios. En febrero de 2026, 40.000
    instancias expuestas estaban indexadas en Censys — el 63% vulnerables a
    ejecución remota de código.
  problem_2: >-
    Más allá de la seguridad: el sistema de memoria era un archivo MEMORY.md.
    El planificador era un daemon que se despertaba cada 30 minutos para leer
    una lista de verificación. No existía el concepto de usuarios separados —
    la documentación listaba "solo la sesión principal escribe en MEMORY.md"
    como una característica. El marketplace de habilidades tenía el 26% de
    entradas con al menos una vulnerabilidad.
  problem_3: >-
    OpenLobster es el fork que resuelve la lista. No es un cambio de nombre —
    es una reescritura de cada parte que estaba rota, partiendo de la premisa
    de que la seguridad no es opcional.
  items:
    - title: "Seguridad por defecto"
      body: >-
        La autenticación del panel se exige antes del primer lanzamiento, no
        es una opción opcional. La configuración y los secretos se cifran en
        disco. Las claves de API viven en un backend de secretos — archivo
        cifrado u OpenBao — nunca en YAML en texto plano. Las variables de
        entorno con el prefijo <code>OPENLOBSTER_</code> nunca se reenvían a
        las herramientas de terminal.
      tag: "Reforzado contra CVE"
    - title: "Memoria en grafo"
      body: >-
        MEMORY.md no escala ni razona sobre relaciones. OpenLobster usa Neo4j
        como base de datos de grafos de primera clase: nodos tipados, aristas
        tipadas y pesos de relación que el agente construye y actualiza al
        conversar. Un backend GML basado en archivos está disponible para
        configuraciones de un solo nodo donde ejecutar Neo4j no es práctico.
      tag: "Neo4j o backend de archivo"
    - title: "Multi-usuario de primera clase"
      body: >-
        Cada usuario en cada canal es una entidad separada: historial de
        conversación propio, permisos de herramientas propios y flujo de
        emparejamiento propio. Un usuario de Telegram y uno de Discord pueden
        hablar con el mismo agente simultáneamente sin compartir contexto ni
        interferir en las sesiones del otro.
      tag: "Permisos por usuario"
    - title: "Planificador de tareas real"
      body: >-
        Se elimina el bucle de latido de 30 minutos que leía una lista
        HEARTBEAT.md. Los trabajos recurrentes usan expresiones cron. Las
        tareas únicas usan fechas y horas ISO 8601. El estado, el tiempo de
        siguiente ejecución y los registros de ejecución son visibles en el
        panel sin tocar ningún archivo de configuración.
      tag: "Cron + ISO 8601"
    - title: "Integración MCP completa"
      body: >-
        Cualquier servidor MCP Streamable HTTP funciona: OAuth 2.1 se gestiona
        de extremo a extremo, la navegación de herramientas es por servidor y
        cada usuario obtiene una matriz de permisos explícita para controlar
        exactamente qué puede invocar. Un marketplace con un clic cubre las
        integraciones más comunes.
      tag: "OAuth 2.1 + matriz por usuario"
    - title: "Backend en Go, binario único"
      body: >-
        Todo el backend de Node.js ha sido reescrito en Go con una API GraphQL
        generada por gqlgen. El resultado es un único binario estático sin
        dependencias en tiempo de ejecución. Arranque en frío de 200 ms. 30 MB
        de RAM. Funciona en una Raspberry Pi 3, un VPS con 512 MB o un
        LicheeRV Nano de $15.
      tag: "Go + gqlgen"

compare:
  label: "Comparación"
  title: "Dónde se posiciona OpenLobster en el ecosistema."
  subtitle: >-
    La familia Claw y el ecosistema más amplio de agentes de IA autoalojados
    comparten objetivos similares pero hacen elecciones muy diferentes.
    OpenClaw, PicoClaw y NanoClaw son parientes arquitectónicos directos.
    Open WebUI y AnythingLLM representan el enfoque alternativo: interfaces
    de chat pulidas sin integraciones de canales ni planificación autónoma.
