features:
  label: "Features"
  title: "Everything you need, in a single binary."
  items:
    - title: "Go + Rust Dual Architecture"
      body: "A hyper-concurrent Go core orchestrates the agent, while critical integrations (AI, WhatsApp, Secrets) run as isolated Rust subprocesses via JSON-RPC. 200ms cold start, 30MB RAM."
      tag: "Isolated Architecture"
    - title: "Graph-Based Memory"
      body: "Moves beyond markdown file limitations. OpenLobster utilizes a proper graph database (Neo4j/GML) to build typed relationships as it interacts, allowing the agent to learn and navigate complex contexts without collapsing."
      tag: "Neo4j / GML"
    - title: "Unified Identities"
      body: "Channel-agnostic management. Each user maintains their own conversation context, allowing the agent to synthesize a global knowledge graph that interconnects information across multiple users and platforms."
      tag: "Global Graph"
    - title: "Event-Driven Scheduler"
      body: "Your agent lives 24/7 without draining resources. A strict event loop wakes it only for real events and timed tasks, ensuring sub-second precision without overhead."
      tag: "Event-Driven Loop"
    - title: "Native MCP Marketplace"
      body: "Give your agent hands instantly. Install Model Context Protocol servers right from the SolidJS dashboard and expand its capabilities (Web Search, Git, Files) without touching code."
      tag: "MCP Integration"
