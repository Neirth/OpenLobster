features:
  label: "核心功能"
  title: "一切所需，尽在一个二进制文件中。"
  items:
    - title: "Go + Rust 双架构"
      body: "高并发 Go 核心负责编排，而关键集成（AI、WhatsApp、机密信息）作为隔离的 Rust 子进程通过 JSON-RPC 运行。200ms 冷启动，30MB 内存占用。"
      tag: "隔离架构"
    - title: "基于图的记忆"
      body: "超越 Markdown 文件的限制。OpenLobster 利用专业的图数据库 (Neo4j/GML) 构建类型化关系，让智能体在交互中学习并导航复杂上下文。"
      tag: "Neo4j / GML"
    - title: "统一身份管理"
      body: "跨渠道身份管理。每个用户维护独立的对话上下文，允许智能体合成跨用户和平台的全局知识图谱。"
      tag: "全局图谱"
    - title: "事件驱动调度器"
      body: "您的智能体全天候运行且不耗资源。严格的事件循环仅在真实事件或定时任务时唤醒，确保毫秒级精度。"
      tag: "事件驱动"
    - title: "原生 MCP 市场"
      body: "即刻为您的智能体增加功能。直接从 SolidJS 控制面板安装 Model Context Protocol 服务，无需修改代码即可扩展能力。"
      tag: "MCP 集成"
