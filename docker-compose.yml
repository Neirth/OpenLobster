version: '3.8'

services:
  openlobster:
    image: openlobster:local
    ports:
      - "8081:8080"
    environment:
      - OPENLOBSTER_GRAPHQL_HOST=0.0.0.0
      - OPENLOBSTER_GRAPHQL_AUTH_TOKEN=${OPENLOBSTER_GRAPHQL_AUTH_TOKEN:-your-secret-token}
      - OPENLOBSTER_MEMORY_BACKEND=gml
      - OPENLOBSTER_MEMORY_GML_PATH=/app/data/memory.gml
      - OPENLOBSTER_MEMORY_NEO4J_URI=bolt://neo4j:7687
      - OPENLOBSTER_MEMORY_NEO4J_USER=neo4j
      - OPENLOBSTER_MEMORY_NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - OPENLOBSTER_SECRETS_BACKEND=openbao
      - OPENLOBSTER_SECRETS_OPENBAO_URL=http://vault:8200
      - OPENLOBSTER_SECRETS_OPENBAO_TOKEN=${VAULT_ROOT_TOKEN:-myroot}
    depends_on:
      - neo4j
      - vault
    volumes:
      - openlobster_data:/app/data
      - openlobster_workspace:/app/workspace

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  vault:
    image: hashicorp/vault:latest
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./.docker/vault/config:/vault/config
      - vault_data:/vault/data
    command: server -config=/vault/config/vault.hcl

volumes:
  openlobster_data:
  openlobster_workspace:
  neo4j_data:
  vault_data:
