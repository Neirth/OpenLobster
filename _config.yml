title: OpenLobster
description: >-
  Personal, self-hosted AI assistant — runs where you want,
  connects to the channels you use.
baseurl: ""
url: "https://neirth.github.io"
repository: Neirth/OpenLobster

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-polyglot

languages: ["en", "es", "zh"]
default_lang: "en"
exclude_from_localization: ["assets", ".jekyll-cache", "install.sh", "llms.txt"]
parallel_localization: false

exclude:
  - apps/
  - packages/
  - schema/
  - docs/
  - ".lock"
  - ".log"
  - node_modules/
  - .docker/
  - .github/
  - Gemfile
  - Gemfile.lock
  - README.md
  - README.en.md
  - README.es.md
  - README.zh.md
  - CONTRIBUTING.md
  - LICENSE.md
