name: Frontend CI

on:
  push:
    branches: [ master, 'feature/**', 'fix/**', 'refactor/**', 'chore/**' ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/tests.frontend-ci.yaml'
  pull_request:
    branches: [ master ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/tests.frontend-ci.yaml'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      node-version: ${{ steps.node-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Node.js version
        id: node-version
        run: |
          VERSION=$(cat .node-version | head -n1 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Node.js version: $VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Verify Node.js version
        run: node -v

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile || pnpm install

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Verify Node.js version
        run: node -v

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck
        run: pnpm --dir apps/frontend typecheck

      - name: Run ESLint
        run: pnpm --dir apps/frontend lint

  unit-tests:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Verify Node.js version
        run: node -v

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Run unit tests with coverage
        run: pnpm --dir apps/frontend test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Verify Node.js version
        run: node -v

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Install Playwright browsers
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --dir apps/frontend test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
