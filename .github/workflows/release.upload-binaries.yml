name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build All Targets (macOS Runner)
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "apps/backend/go.mod"
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, aarch64-apple-darwin

      - name: Install Cross-compilation Toolchains (macOS)
        run: |
          brew tap messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-musl aarch64-unknown-linux-musl jq

      - name: Build All Production Binaries
        run: make release

      - name: Upload Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          gh release upload "${VERSION}" \
            dist/openlobster-linux-amd64 \
            dist/openlobster-linux-arm64 \
            dist/openlobster-darwin-arm64 \
            --clobber
